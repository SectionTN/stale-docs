name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: upload scanner asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" hooks/check-stale.js --clobber
