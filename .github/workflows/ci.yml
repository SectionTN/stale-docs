name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: syntax
        run: node --check hooks/check-stale.js
      - name: tests
        run: node tests/run.js
      - name: dogfood
        run: node hooks/check-stale.js --audit --ci
